<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopNow no Instagram</title>
<meta name="description" content="O ShopNow no Instagram: @shopnow.app.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#4F46E5">

<style>
  :root {
    --bg: #F7F7FC;
    --surface: #FFFFFF;
    --border: #E3E3EE;
    --text: #16152A;
    --text-2: #64648A;
    --accent: #4F46E5;
    --accent-hover: #4338CA;
    --on-accent: #FFFFFF;
    --accent-dim: #EEEEFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D0D1A;
      --surface: #16162A;
      --border: #28284A;
      --text: #E6E6F6;
      --text-2: #9494BA;
      --accent: #6366F1;
      --accent-hover: #7577F5;
      --accent-dim: #1A1A3A;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  a { color: var(--accent); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 1.5rem; width: 100%; }
  main { flex: 1; }

  .hero { text-align: center; padding: 2.5rem 0 1.5rem; }
  .logo {
    width: 84px; height: 84px; border-radius: 20px;
    box-shadow: 0 8px 24px rgba(79, 70, 229, 0.28);
    margin-bottom: 1.25rem;
  }
  h1 {
    font-size: clamp(2rem, 8vw, 2.6rem);
    letter-spacing: -0.035em; line-height: 1.1; font-weight: 800;
  }
  .lead { margin-top: 0.75rem; font-size: 1.05rem; color: var(--text-2); }

  .acoes { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.75rem; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    min-height: 56px; padding: 0.9rem 1.5rem; border-radius: 14px;
    background: var(--accent); color: var(--on-accent);
    font-weight: 600; font-size: 1.1rem; text-decoration: none; text-align: center;
    border: 2px solid var(--accent);
  }
  .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:focus-visible { outline: 3px solid var(--accent-dim); outline-offset: 3px; }
  .btn.menor {
    min-height: 48px; font-size: 0.98rem;
    background: var(--surface); color: var(--accent); border-color: var(--border);
  }
  .btn.menor:hover { border-color: var(--accent); background: var(--accent-dim); }
  .btn[hidden] { display: none; }

  footer { border-top: 1px solid var(--border); padding: 2.5rem 0 3.5rem; margin-top: 2.5rem; text-align: center; font-size: 0.92rem; color: var(--text-2); }
  footer nav { margin-top: 0.6rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem 1.4rem; }
</style>
</head>
<body>

<main>
  <header class="hero">
    <div class="wrap">
      <img class="logo" src="/icon.png" width="84" height="84" alt="Ícone do ShopNow">
      <h1>@shopnow.app</h1>
      <div class="acoes">
        <a class="btn" id="btn-instagram" href="https://www.instagram.com/shopnow.app/">Abrir o @shopnow.app no Instagram</a>
      </div>
    </div>
  </header>
</main>

<footer>
  <div class="wrap">
    <p>ShopNow — shopnowapp.com.br</p>
    <nav aria-label="Rodapé">
      <a href="https://felipeaugustomsilva-stack.github.io/smartshop-privacy/">Política de privacidade</a>
      <a href="mailto:contato@shopnowapp.com.br">contato@shopnowapp.com.br</a>
    </nav>
  </div>
</footer>

<script>
/* DETECCAO-INICIO */
var ShopNowBaixar = (function () {
  // Tabela unica de nomes (fonte: docs/observabilidade/utm-baixar.md). Tudo em minusculas, igual nas duas lojas.
  var CANAIS = {
    instagram: { ct: 'instagram', src: 'instagram', med: 'social' },
    facebook: { ct: 'facebook', src: 'facebook', med: 'social' },
    'status-whatsapp': { ct: 'status-whatsapp', src: 'status-whatsapp', med: 'whatsapp' },
    crm: { ct: 'crm', src: 'crm', med: 'crm' },
    site: { ct: 'site', src: 'site', med: 'site' }
  };
  var CAMPANHAS = ['presentes-lancamento', 'radar-bf', 'cesta', 'lista-casa', 'versao', 'perfil'];

  function canal(search) {
    var c = new URLSearchParams(search).get('c');
    c = c ? c.trim().toLowerCase() : '';
    return Object.prototype.hasOwnProperty.call(CANAIS, c) ? c : 'site';
  }

  // ?k=: fora da tabela (ou ausente) vira 'perfil'.
  function campanha(search) {
    var k = new URLSearchParams(search).get('k');
    k = k ? k.toLowerCase() : '';
    return CAMPANHAS.indexOf(k) >= 0 ? k : 'perfil';
  }

  // ?u= (slug do criativo): [a-z0-9-], ate 40. Maiuscula normaliza; espaco, acento ou mais de 40 = descartado ('').
  function conteudo(search) {
    var u = new URLSearchParams(search).get('u');
    u = u ? u.toLowerCase() : '';
    return /^[a-z0-9-]{1,40}$/.test(u) ? u : '';
  }

  // Apple: so o ct com o canal. Android: referrer com source, medium, campaign e, se houver, content.
  function links(c, k, u) {
    var d = CANAIS[c];
    return {
      ios: 'https://apps.apple.com/app/apple-store/id6802871488?pt=129324162&ct=' + d.ct + '&mt=8',
      android: 'https://play.google.com/store/apps/details?id=com.felipeamsilva.meuappcompras&referrer=' +
        'utm_source%3D' + d.src + '%26utm_medium%3D' + d.med + '%26utm_campaign%3D' + (CAMPANHAS.indexOf(k) >= 0 ? k : 'perfil') +
        (u ? '%26utm_content%3D' + u : '')
    };
  }

  // destaque: 'ios' | 'android' | 'ambos'; navegador interno: Instagram ou Facebook
  function detectar(ua, toques) {
    ua = ua || '';
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && toques > 1);
    var android = !ios && /Android/.test(ua);
    return {
      destaque: ios ? 'ios' : (android ? 'android' : 'ambos'),
      interno: /Instagram|FBAN|FBAV/.test(ua)
    };
  }

  // Resolve true so se a copia aconteceu de fato.
  function copiar(texto) {
    function viaTextarea() {
      try {
        var ta = document.createElement('textarea');
        ta.value = texto;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, texto.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok === true;
      } catch (e) { return false; }
    }
    var moderna = null;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) moderna = navigator.clipboard.writeText(texto);
    } catch (e) { moderna = null; }
    if (!moderna) return Promise.resolve(viaTextarea());
    return moderna.then(function () { return true; }, function () { return viaTextarea(); });
  }

  // Valor bruto do parametro, so para o contador: '' se nao veio; 'invalido' se fora de [a-z0-9-]{1,40}; senao o slug.
  function pedido(search, nome) {
    var bruto = new URLSearchParams(search).get(nome);
    if (bruto === null || bruto === '') return '';
    bruto = bruto.toLowerCase();
    return /^[a-z0-9-]{1,40}$/.test(bruto) ? bruto : 'invalido';
  }

  // Corpo do contador agregado (text/plain com JSON). Sem identificador: so tipo, canal, campanha, conteudo, loja e destaque.
  // extra: { k, u, canalPedido, campanhaPedido } (k ja normalizado; os *Pedido sao o valor bruto).
  function corpoAcesso(tipo, c, loja, destaque, extra) {
    extra = extra || {};
    var o = { tipo: tipo, canal: Object.prototype.hasOwnProperty.call(CANAIS, c) ? c : 'site' };
    o.campanha = CAMPANHAS.indexOf(extra.k) >= 0 ? extra.k : 'perfil';
    if (extra.canalPedido) o.canalPedido = extra.canalPedido;
    if (extra.campanhaPedido) o.campanhaPedido = extra.campanhaPedido;
    if (extra.u && /^[a-z0-9-]{1,40}$/.test(extra.u)) o.conteudo = extra.u;
    if (tipo === 'clique' && (loja === 'ios' || loja === 'android')) o.loja = loja;
    if (destaque === 'ios' || destaque === 'android' || destaque === 'ambos') o.destaque = destaque;
    return JSON.stringify(o);
  }

  // Envia sem bloquear nada e sem nunca lancar: sendBeacon, e fetch keepalive se o beacon recusar.
  function enviar(url, corpo) {
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(url, corpo)) return;
    } catch (e) {}
    try {
      fetch(url, { method: 'POST', body: corpo, keepalive: true, mode: 'no-cors', credentials: 'omit' }).catch(function () {});
    } catch (e) {}
  }

  return { canal: canal, campanha: campanha, conteudo: conteudo, links: links, detectar: detectar, copiar: copiar, pedido: pedido, corpoAcesso: corpoAcesso, enviar: enviar };
})();
/* DETECCAO-FIM */

/* CRM-INICIO */
var ShopNowCRM = (function () {
  // Links do CRM (/insta/ e /abrir/, 2026-11-16). Usa o bloco ShopNowBaixar acima (copia identica ao da /baixar/).
  // O scheme das builds e meuappcompras (app.json), nao shopnow. Com caminho: sem ele, com o app ja aberto, o link cairia na Conta.
  var ESQUEMA = 'meuappcompras://listas-compra';
  var PACOTE = 'com.felipeamsilva.meuappcompras';
  var INSTAGRAM = 'https://www.instagram.com/shopnow.app/';
  var ENDPOINT = 'https://southamerica-east1-meu-app-compras.cloudfunctions.net/registrarAcessoBaixar';
  var ESPERA_MS = 1500;

  // u com cara de dado pessoal: 8+ digitos seguidos (telefone) ou um pedaco de 20+ caracteres entre hifens (id, hash).
  // E-mail ja cai no slug. Mesma regra de pareceDadoPessoal em functions/src/observabilidade/baixar.ts.
  function pareceDadoPessoal(u) {
    if (/\d{8,}/.test(u)) return true;
    var partes = u.split('-');
    for (var i = 0; i < partes.length; i++) if (partes[i].length >= 20) return true;
    return false;
  }

  function conteudo(search) {
    var u = ShopNowBaixar.conteudo(search);
    return u && !pareceDadoPessoal(u) ? u : '';
  }

  // Para onde vai a contagem: producao so no proprio site; em localhost so para ?api=http://127.0.0.1:PORTA (servidor de
  // teste), nunca para producao. Qualquer outro host: nao conta.
  function endpoint(loc) {
    if (/^(localhost|127\.0\.0\.1)$/.test(loc.hostname)) {
      var api = new URLSearchParams(loc.search).get('api') || '';
      return /^http:\/\/(localhost|127\.0\.0\.1):\d{2,5}$/.test(api) ? api + '/registrarAcessoBaixar' : '';
    }
    return /^(www\.)?shopnowapp\.com\.br$/.test(loc.hostname) ? ENDPOINT : '';
  }

  // Corpo do contador com a pagina. reserva = toque no botao de reserva (sem loja); automatico = ida sozinha a loja (com loja).
  function corpo(pagina, tipo, c, loja, destaque, extra) {
    var o = JSON.parse(ShopNowBaixar.corpoAcesso(tipo === 'automatico' ? 'clique' : tipo, c, loja, destaque, extra));
    o.tipo = tipo;
    o.pagina = pagina;
    return JSON.stringify(o);
  }

  // Android: intent com o pacote; sem o app, o proprio Chrome vai ao Play (browser_fallback_url).
  function intentAndroid(play) {
    return 'intent://listas-compra#Intent;scheme=meuappcompras;package=' + PACOTE +
      ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
  }

  // O que a /abrir/ faz em cada aparelho; null = computador (so os dois botoes de loja, sem tentar o app).
  function planoAbrir(destaque, url) {
    if (destaque === 'ios') return { app: ESQUEMA, loja: 'ios', lojaUrl: url.ios };
    if (destaque === 'android') return { app: intentAndroid(url.android), loja: 'android', lojaUrl: url.android };
    return null;
  }

  // Tenta o app; se a pagina seguir visivel por ESPERA_MS, vai a loja. Pagina oculta (o app abriu) cancela: a loja nunca
  // abre por cima do app. Sem 'blur': o alerta de endereco invalido do Safari tira o foco e cancelaria a ida a loja.
  function tentarApp(w, plano, aoIrLoja) {
    var t = null;
    function cancelar() { if (t !== null) { w.clearTimeout(t); t = null; } }
    w.document.addEventListener('visibilitychange', function () { if (w.document.visibilityState === 'hidden') cancelar(); });
    w.addEventListener('pagehide', cancelar);
    function tentar() {
      cancelar();
      t = w.setTimeout(function () {
        t = null;
        if (w.document.visibilityState === 'hidden') return;
        aoIrLoja();
        w.location.href = plano.lojaUrl;
      }, ESPERA_MS);
      w.location.href = plano.app;
    }
    return { tentar: tentar, cancelar: cancelar };
  }

  return {
    ESQUEMA: ESQUEMA, INSTAGRAM: INSTAGRAM, ESPERA_MS: ESPERA_MS,
    pareceDadoPessoal: pareceDadoPessoal, conteudo: conteudo, endpoint: endpoint, corpo: corpo,
    intentAndroid: intentAndroid, planoAbrir: planoAbrir, tentarApp: tentarApp
  };
})();
/* CRM-FIM */

(function () {
  try {
    var q = window.location.search;
    var c = ShopNowBaixar.canal(q);
    var det = ShopNowBaixar.detectar(navigator.userAgent, navigator.maxTouchPoints || 0);
    var fim = ShopNowCRM.endpoint(window.location);
    var extra = {
      k: ShopNowBaixar.campanha(q), u: ShopNowCRM.conteudo(q),
      canalPedido: ShopNowBaixar.pedido(q, 'c'), campanhaPedido: ShopNowBaixar.pedido(q, 'k')
    };
    function conta(tipo) { if (fim) ShopNowBaixar.enviar(fim, ShopNowCRM.corpo('insta', tipo, c, null, det.destaque, extra)); }
    document.getElementById('btn-instagram').addEventListener('click', function () { try { conta('reserva'); } catch (e) {} });
    conta('visita');
    // O beacon ja saiu (sendBeacon sobrevive a troca de pagina); a folga so cobre o fetch keepalive de navegador sem beacon.
    window.setTimeout(function () { window.location.replace(ShopNowCRM.INSTAGRAM); }, 150);
  } catch (e) {}
})();
</script>
</body>
</html>
